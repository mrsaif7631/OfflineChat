
# Automatically builds and publishes OfflineChat APK
name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OfflineChat APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 5. Build Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 6. Verify and rename APK
      - name: Prepare APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            find . -type f -name "*.apk"
            exit 1
          fi

          cp "$APK_PATH" OfflineChat.apk

          echo "APK generated successfully!"
          ls -lh OfflineChat.apk

      # 7. Upload APK as GitHub Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineChat-apk
          path: OfflineChat.apk
          if-no-files-found: error
          retention-days: 30

      # 8. Publish APK on GitHub Releases
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Offline Chat (Build ${{ github.run_number }})
          body: |
            ## OfflineChat Android Application

            Download OfflineChat.apk below.

            - Android APK: Debug signed
            - Offline functionality
            - Bluetooth and Wi-Fi Direct support
            - No internet or SIM required for offline features

          files: OfflineChat.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
